<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101E38" />
  <meta name="description" content="Building Real Wealth — Companion workbook for net worth, cash flow, allocation and action planning." />
  <title>Building Real Wealth — Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p style="font-size:13px;color:var(--ink-soft)">Opening your workbook…</p>
  </div>

  <div id="app" style="display:none;">
    <header>
      <div class="hdr-top">
        <div>
          <div class="hdr-eyebrow">BUILDING REAL WEALTH</div>
          <h1>Your Companion</h1>
        </div>
      </div>
      <div class="hdr-nw-label">Net worth</div>
      <div class="hdr-nw-value" id="hdrNetWorth">$0</div>
      <div id="hdrDelta"></div>
    </header>

    <main id="main"></main>

    <div class="toast" id="toast"></div>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V15h4v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10"/></svg>
        <span>Home</span>
      </button>
      <button data-tab="networth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M20 19V3"/></svg>
        <span>Net Worth</span>
      </button>
      <button data-tab="cashflow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18M3 7l3-3M3 7l3 3M21 17H3M21 17l-3-3M21 17l-3 3"/></svg>
        <span>Cash Flow</span>
      </button>
      <button data-tab="invest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.3"/><path d="M12 3.7V12l6 3.2"/></svg>
        <span>Invest</span>
      </button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h6a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.74.44L12 17.5l-4.26 2.44A.5.5 0 0 1 7 19.5V6a2 2 0 0 1 2-2Z"/></svg>
        <span>Plan</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
